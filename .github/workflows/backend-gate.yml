name: Backend Gate

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "apps/backend/**"
      - "vitest.config.ts"
      - "vitest.backend.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "sgconfig.yml"
      - "tools/**"
      - ".github/workflows/backend-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SCENARIO_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm --filter . --filter @partner-up-dev/backend... install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm check:type:backend

      - name: Validate backend config artifacts
        run: pnpm check:config:backend

      - name: Build backend reachability targets
        run: pnpm check:build:backend

      - name: Run backend unit tests
        run: pnpm test:unit:backend

      - name: Run backend scenario tests
        run: pnpm test:scenario:backend
