name: Web Gate

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "apps/web/**"
      - "apps/backend/src/**"
      - "vitest.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".npmrc"
      - "biome.json"
      - ".github/workflows/frontend-gate.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  web-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm check:type:web

      - name: Run web unit tests
        run: pnpm test:unit:web

      - name: Build web
        run: pnpm check:build:web
