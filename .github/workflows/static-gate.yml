name: Static Gate

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - ".github/workflows/static-gate.yml"
      - ".node-version"
      - ".npmrc"
      - "AGENTS.md"
      - "apps/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "tools/**"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "knip.json"
      - "sgconfig.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vitest.config.ts"
      - "vitest.backend.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Semgrep
        run: python -m pip install semgrep==1.166.0

      - name: Check repository formatting
        run: pnpm check:format

      - name: Run static lint
        run: pnpm check:lint

      - name: Report dead code and dependency hygiene
        run: pnpm check:dead-code

      - name: Report security findings
        run: pnpm check:security
