name: Validate Backend DB Artifacts

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - ".node-version"
      - "apps/backend/**"
      - ".github/workflows/backend-db-validate.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: read

jobs:
  validate-db-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies (workspace)
        run: pnpm --filter @partner-up-dev/backend... install --frozen-lockfile

      - name: Lint migration and seed files
        run: pnpm --filter @partner-up-dev/backend db:lint

      - name: Regenerate Drizzle SQL artifacts
        run: pnpm --filter @partner-up-dev/backend db:generate

      - name: Fail on uncommitted Drizzle artifact drift
        run: git diff --exit-code -- apps/backend/drizzle apps/backend/drizzle/meta
